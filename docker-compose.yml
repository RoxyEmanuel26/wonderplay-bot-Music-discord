services:
  bot:
    build: .
    container_name: aurelia_bot
    restart: always
    env_file: .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/aurelia?schema=public
      - REDIS_URL=redis://redis:6379
      - LAVALINK_URL=lavalink:2333
      - LAVALINK_PASSWORD=${LAVALINK_PASSWORD:-youshallnotpass}
      - LAVALINK_SECURE=false
      - LAVALINK_USE_PUBLIC_NODES=${LAVALINK_USE_PUBLIC_NODES:-false}
      - LAVALINK_PRIVATE_ONLY=${LAVALINK_PRIVATE_ONLY:-true}
      - LYRICS_API_URL=${LYRICS_API_URL:-https://lrclib.net}
      - SPOTIFY_TRACK_FALLBACK_ENABLED=${SPOTIFY_TRACK_FALLBACK_ENABLED:-true}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
      - SPOTIFY_REFRESH_TOKEN=${SPOTIFY_REFRESH_TOKEN:-}
      - SPOTIFY_PLAYLIST_MAX_TRACKS=${SPOTIFY_PLAYLIST_MAX_TRACKS:-500}
      - SPOTIFY_MIRROR_CONCURRENCY=${SPOTIFY_MIRROR_CONCURRENCY:-3}
      - PLAYBACK_RECOVERY_ENABLED=${PLAYBACK_RECOVERY_ENABLED:-true}
      - PLAYBACK_CHECKPOINT_INTERVAL_MS=${PLAYBACK_CHECKPOINT_INTERVAL_MS:-5000}
    depends_on:
      - postgres
      - redis
      - lavalink
    ports:
      - "3000:3000"

  postgres:
    image: postgres:15-alpine
    container_name: aurelia-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: aurelia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: aurelia-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: aurelia-lavalink
    ports:
      - "2333:2333"
    environment:
      - _JAVA_OPTIONS=-Xmx2G
      - SERVER_PORT=2333
      - LAVALINK_SERVER_PORT=2333
      - LAVALINK_SERVER_PASSWORD=${LAVALINK_PASSWORD:-youshallnotpass}
      - YOUTUBE_OAUTH_ENABLED=${YOUTUBE_OAUTH_ENABLED:-false}
      - YOUTUBE_OAUTH_REFRESH_TOKEN=${YOUTUBE_OAUTH_REFRESH_TOKEN:-}
      - YOUTUBE_OAUTH_SKIP_INITIALIZATION=${YOUTUBE_OAUTH_SKIP_INITIALIZATION:-false}
      - LAVASRC_SPOTIFY_ENABLED=${LAVASRC_SPOTIFY_ENABLED:-true}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
      - SPOTIFY_COUNTRY_CODE=${SPOTIFY_COUNTRY_CODE:-ID}
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
